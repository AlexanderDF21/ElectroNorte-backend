spring.application.name=mesa-ayuda-backend

server.port=8080

spring.datasource.url=jdbc:mysql://mysql-electronorte-sac.mysql.database.azure.com:3306/mesa_ayuda_db?sslMode=REQUIRED&serverTimezone=America/Lima
spring.datasource.username=adminsql
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET}

# Zona horaria de la aplicación - Perú
spring.jackson.time-zone=America/Lima
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima